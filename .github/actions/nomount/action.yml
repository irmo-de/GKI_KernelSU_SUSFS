name: Integrate NoMount
description: Integrates NoMount VFS path redirection into the kernel

runs:
  using: composite
  steps:
    - name: Apply NoMount kernel patch (excluding task_mmu.c)
      working-directory: ${{ github.workspace }}/kernel/common
      shell: bash
      run: |
        set -euo pipefail
        PATCH_URL="https://raw.githubusercontent.com/maxsteeel/nomount/main/kernel/patches/nomount_5.10_kernel_integration.patch"
        echo "[nomount] Downloading 5.10 integration patch..."
        curl -fsSL "$PATCH_URL" -o /tmp/nomount_full.patch
        python3 -c "import re; content=open('/tmp/nomount_full.patch').read(); parts=re.split(r'(?=^diff --git )',content,flags=re.MULTILINE); filtered=[p for p in parts if p.strip() and 'task_mmu.c' not in p]; open('/tmp/nomount_notaskmmu.patch','w').write(''.join(filtered)); print('[nomount] Stripped task_mmu.c hunk, kept',len(filtered),'sections')"
        patch -p1 --forward < /tmp/nomount_notaskmmu.patch
        echo "[nomount] Main patch applied"

    - name: Apply combined task_mmu.c patch (nomount + SUSFS merged)
      working-directory: ${{ github.workspace }}/kernel/common
      shell: bash
      run: |
        set -euo pipefail
        PATCH="${{ github.workspace }}/.github/patches/task_mmu_nomount_susfs.patch"
        echo "[nomount] Applying combined task_mmu.c patch..."
        patch -p1 --forward < "$PATCH"
        echo "[nomount] task_mmu.c patch done"

    - name: Copy NoMount source files
      working-directory: ${{ github.workspace }}/kernel/common
      shell: bash
      run: |
        set -euo pipefail
        BASE="https://raw.githubusercontent.com/maxsteeel/nomount/main/kernel/src"
        curl -fsSL "$BASE/nomount.c" -o fs/nomount.c
        curl -fsSL "$BASE/nomount.h" -o fs/nomount.h
        echo "[nomount] Source files copied to fs/"

    - name: Enable NoMount config
      working-directory: ${{ github.workspace }}/kernel
      shell: bash
      run: |
        echo "CONFIG_NOMOUNT=y" >> wild_gki.fragment
        echo "[nomount] CONFIG_NOMOUNT=y added to config fragment"